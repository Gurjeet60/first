apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
  namespace: laravel

data:
  APP_NAME: Laravel
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://laracoffee.local

  DB_CONNECTION: mysql
  DB_HOST: mysql-service
  DB_PORT: "3306"
  DB_DATABASE: laravel
  DB_USERNAME: laravel

  CACHE_DRIVER: database
  SESSION_DRIVER: database
  QUEUE_CONNECTION: sync
