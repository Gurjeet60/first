apiVersion: apps/v1
kind: Deployment

metadata:
  name: laravel-app
  namespace: laravel

spec:
  replicas: 3

  selector:
    matchLabels:
      app: laravel-app

  template:
    metadata:
      labels:
        app: laravel-app

    spec:
      containers:
      - name: laravel-app

        image: gurjeet12/laravel_app:v3

        imagePullPolicy: Always

        ports:
        - containerPort: 80
       
        env:
   
         - name: DB_CONNECTION
           value: mysql
         - name: DB_HOST
           value: mysql
         - name: DB_PORT
           value: "3306"
         - name: DB_DATABASE
           value: laravel
         - name: DB_USERNAME
           value: laravel
         - name: DB_PASSWORD
           value: NewPassword123!
