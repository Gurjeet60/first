apiVersion: apps/v1
kind: Deployment

metadata:
  name: laravel-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: laravel-app

  template:
    metadata:
      labels:
        app: laravel-app

    spec:
      containers:
      - name: laravel-app

        image: gurjeet12/laravel_app:v3

        imagePullPolicy: Always

        ports:
        - containerPort: 80
